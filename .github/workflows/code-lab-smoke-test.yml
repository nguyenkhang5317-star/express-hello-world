name: Code Lab smoke test

on:
  push:
    branches: [wormgpt-code-lab]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --check app.js
      - name: Start app and test routes
        run: |
          npm start > /tmp/code-lab.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3001/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3001/ | grep -q 'WormGPT Code Lab'
          curl -fsS http://127.0.0.1:3001/api/status | grep -q 'configured'
